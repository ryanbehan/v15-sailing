# For local editing, run `npx netlify-cms-proxy-server` and uncomment:
# local_backend: true
backend:
  name: git-gateway
  branch: main
  repo: ryanbehan/v15-sailing

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: articles
    label: Articles
    folder: doc/articles
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Body, name: body, widget: markdown }
  - name: parts
    label: Parts
    folder: content/parts
    create: true
    delete: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - { label: Name, name: name, widget: string }
      - { label: URL, name: url, widget: string }
      - { label: Description, name: description, widget: text }
  - name: regattas
    label: Regattas
    folder: content/regattas
    create: true
    delete: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - { label: Event Name, name: name, widget: string }
      - { label: Date, name: date, widget: string }
      - { label: Location, name: location, widget: string }
      - { label: Registration URL, name: url, widget: string }
